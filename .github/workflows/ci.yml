name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shell syntax + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (構文チェック)
        # 対象はハードコードせず git 管理下の全 *.sh (shellcheck ジョブと同じ列挙方法。
        # リストを 2 箇所に持つと新規スクリプトの追加漏れが起きる)
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: git diff --check (whitespace エラー)
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        # apt 経由 (apt-get install shellcheck) が 10分以上ハングする事象が run 32272446476 /
        # 32275117537 で発生したため、公式 static バイナリ取得に置き換え。
        # sha256 は https://github.com/koalaman/shellcheck/releases/tag/v0.11.0 の
        # shellcheck-v0.11.0.linux.x86_64.tar.xz をダウンロードして
        # `sha256sum shellcheck.tar.xz` で算出（release に checksum ファイルの配布なし）。
        run: |
          set -euo pipefail
          curl -sSL -o shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          install -m 755 shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - name: run shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning

  python:
    name: pytest + ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install ruff + pytest
        run: pip install ruff pytest
      - name: pytest (watchd / report ledger)
        run: python3 -m pytest tests/ -q
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
