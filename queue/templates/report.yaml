# 報告テンプレート
# コピーして queue/projects/<project>/reports/worker{N}_report.yaml として使用する。
# 詳細な運用ルールは instructions/dispatcher.md 参照。

# 必須: この報告の配達 ID (UUIDv4)。`python3 -c "import uuid; print(uuid.uuid4())"` 等で
# report を**新規作成するときに一度だけ**発番する。同じ報告の修正・再出力・archive からの
# 復帰では変えない (watcher が (project, report_id) で重複配達を抑止する)。
# 別の報告は内容が同じでも必ず新しい ID にする。欠落・非 UUID は [REPORT-INVALID] 通知になる。
report_id: "00000000-0000-4000-8000-000000000000"
# 対応する task.yaml の task_id
task_id: TASK-XXX
# 例: my-app
project: <project>
# 例: worker1 / worker2 / worker3 / worker4
worker: worker1
# 必須: claude | codex (実際に作業した agent 種別)
agent: claude
# 必須: 成果物 (PR 等) を作成した agent。
# cross-review タスクではレビュー対象の作者を指す
author_agent: claude
# completed / failed / blocked
status: completed
# 必須: pass / fail / skipped
# (検証ゲートの結果。verify: が無いタスクは skipped)
verify_status: pass
# 以下4フィールドはレビュー/サボタージュ検証タスクのみ必須。作業ツリーを汚さず
# 使い捨てコピーで検証したことを Dispatcher が機械判定できるようにする。
# 非レビュータスクは省略可。
#
# 書き方は 2 通り (どちらも scripts/check_source_tree_clean.py が機械検証する。SQUAD-251):
#
# (A) フラット形式 (単一 worktree のみ確認する場合。既定はこちら):
#   下の 4 フィールドをこのままトップレベルに直接書く。
#
# (B) source_tree_clean: ネスト形式 (複数 worktree を同時に確認する場合。
#     例: rmf_ros2 と rmf_traffic を同じ report で確認するタスク):
#   下の 4 フィールドは書かず、代わりに次のように書く。
#
#   source_tree_clean:
#     - source_worktree: "/path/to/worktree-a"
#       status_command: "git -C /path/to/worktree-a status -s"
#       source_tree_status: ""
#       checked_at: "2026-08-28T12:00:00+09:00"
#     - source_worktree: "/path/to/worktree-b"
#       status_command: "git -C /path/to/worktree-b status -s"
#       source_tree_status: ""
#       checked_at: "2026-08-28T12:00:00+09:00"
#
#   worktree が 1 つだけでもネスト形式で書きたい場合は、リストの `-` を外した
#   マッピング (`source_tree_clean:` の直下に 4 フィールドを並べる) でもよい。
#   (A) と (B) を同じ report に混在させない。
#
# 確認対象の worktree 絶対パス。使える文字は英数字と `/ _ - . ~` のみ (allowlist)。
# シェルメタ文字 (`;` `&` `|` バッククォート `$` `(` `)` `<` `>`)・空白・改行/タブは禁止
# (scripts/check_source_tree_clean.py が機械検証で弾く。SQUAD-254)。
source_worktree: ""
# `git status -s` の生出力 (空文字列なら clean)。"clean" のような説明語を書かない
# こと — 空文字列だけが clean の申告として扱われる。複数行になる場合は block scalar
# (`source_tree_status: |` の下に生出力をそのままインデントして書く) でよい。
source_tree_status: ""
# 必須固定書式: "git -C <source_worktree> status -s"
# <source_worktree> の位置には上記 source_worktree フィールドと**文字列一致する絶対パス**
# を書くこと。`git -C` を省いた形式・`cd <path> && git status -s` のような形式は無効
# (scripts/check_source_tree_clean.py が機械検証で弾く)。
status_command: ""
# 確認時刻。ISO8601 (タイムゾーン付き、例: 2026-08-21T12:00:00+09:00) 必須
checked_at: ""
# 例: /path/to/worktree/reports/worker1_verdict.yaml
# (verify した場合の verifier 出力先)
verdict_path: ""
# 例: https://github.com/owner/repo/pull/123 (PR を投げた場合は必須)
pr_url: ""
# summary は10行厳守。超過する内容は details_path に退避し、
# summary は結論1-2文 + details_path 参照のみとする
summary: "作業結果の概要を1-2文で"
# 詳細を書いた場合のみ queue/projects/<project>/reports/worker{N}_details.md の絶対パスを入れる
# (書かない場合は空文字のままでよい)
details_path: ""
# 任意 (省略可。既存 report との後方互換を壊さない)。
# task の前提や結論として downstream の判断を拘束する claim を **最大3件だけ** 書く。
# status は confirmed | falsified | uncertain。
# - **falsified の claim から follow-up の修正 task を作らない。** 誤った前提を潰したこと
#   自体が成果であり、そこで打ち切る。
# - worker は task の前提を反証した時点で成功として report してよい
#   (status: completed のままでよい。反証は失敗ではない)。
decision_bearing_claims: []
# - claim: "project 空の observation に重複書き込みがある"
#   status: falsified
#   evidence: "330 組すべてが supersedes による backfill copy。raw と logical の混同だった"
# ブロッカーや懸念点があれば記述
issues: []
# - "issue の説明"
# blocked 時は verdict の絶対パスと残課題を必ず記載
notes: ""
# 任意: 作業対象 worktree の HEAD SHA (git を使わないタスクは unknown / 空欄でよい)
git_head: ""
# 推奨 (SQUAD-261): 自分自身の session id。環境変数 `$CLAUDE_CODE_SESSION_ID` の値をそのまま
# 記録する (`echo "$CLAUDE_CODE_SESSION_ID"` で取得可能)。scripts/measure_task_cost.py が
# これを使って ~/.claude/projects/*/<session_id>.jsonl を直接特定し、同一 cwd の他セッション
# を混入させずに集計できるようになる (無ければ時間窓による近似集計にフォールバックする)。
session_id: ""
# 任意 (SQUAD-265): 5h/7d usage limit の消費を測りたい場合のみ記録する。task 着手前後に
# `python3 scripts/measure_task_cost.py --quota-snapshot` を実行し、その JSON の
# five_hour_pct / seven_day_pct / source を before/after にそれぞれ転記する。
# **アカウント全体で共有される値**であり、並行稼働する他 worker の消費も混ざるため、
# 単一 task の消費を厳密に分離した値ではない (詳細は SQUAD-265 report 参照)。
quota_5h_before_pct: ""
quota_5h_after_pct: ""
quota_7d_before_pct: ""
quota_7d_after_pct: ""
# 取得手段 ("usage_cache_file" | "tmux_status_line" | "unavailable")
quota_source: ""
# ISO8601形式
completed_at: "2026-01-01T12:00:00+09:00"
